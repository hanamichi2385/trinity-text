name: CodeQL

on:
  push:
    branches:
    - 'main'
  pull_request:
    branches:
    - 'main'
  schedule:
  - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 8.0.x

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: csharp
        build-mode: manual

    - name: Build
      run: dotnet build Trinity.sln --configuration Release

    - name: Analyze
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:csharp"
