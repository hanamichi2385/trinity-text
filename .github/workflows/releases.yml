name: Release packages

# Only when a release is published. "edited" / "released" made a single release publish
# several packages (one per event, each with a different run number).
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  SOLUTION_NAME: Trinity.sln
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Optional: add required reviewers to the "nuget" environment (Settings > Environments) to gate the publish
    environment: nuget
    steps:
    - uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 8.0.x

    - name: Determine version
      id: version
      env:
        PRERELEASE: ${{ github.event.release.prerelease }}
      run: |
        set -euo pipefail
        base=$(grep -Po '(?<=<Version>)[^<]+' SolutionItems/GlobalAssemblyInfo.proj | head -n 1)
        suffix=""
        if [ "$PRERELEASE" = "true" ]; then
          suffix="-beta"
        fi
        # 1.3.0 -> 1.3.<run number>[-beta]
        version="${base%.*}.${GITHUB_RUN_NUMBER}${suffix}"
        echo "Base version: $base"
        echo "Publish version: $version"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Restore
      run: dotnet restore "$SOLUTION_NAME"

    - name: Build
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: dotnet build "$SOLUTION_NAME" --configuration Release --no-restore -p:Version="$VERSION" -p:ContinuousIntegrationBuild=true

    - name: Test (offline)
      run: dotnet test "$SOLUTION_NAME" --configuration Release --no-build --filter "TestCategory=Offline"

    - name: Pack
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: dotnet pack "$SOLUTION_NAME" --configuration Release --no-build --output "$GITHUB_WORKSPACE/nupackages" -p:Version="$VERSION" -p:ContinuousIntegrationBuild=true

    - name: Upload to NuGet
      env:
        NUGET_API_KEY: ${{ secrets.nuget_api_key }}
      run: |
        set -euo pipefail
        ls -1 "$GITHUB_WORKSPACE/nupackages"
        # the .snupkg symbol packages next to each .nupkg are pushed automatically
        for package in "$GITHUB_WORKSPACE"/nupackages/*.nupkg; do
          dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        done
