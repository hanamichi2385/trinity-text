name: Build

on:
  push:
    branches:
    - 'main'
  pull_request:
    branches:
    - 'main'

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLUTION_NAME: Trinity.sln
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 8.0.x

    - name: Restore
      run: dotnet restore "$SOLUTION_NAME"

    - name: Build
      run: dotnet build "$SOLUTION_NAME" --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

    # Only tests that need no database (the others require a SQL Server, see TestCategory("Offline"))
    - name: Test (offline)
      run: dotnet test "$SOLUTION_NAME" --configuration Release --no-build --filter "TestCategory=Offline" --logger "console;verbosity=normal"

    # Fails the build when a dependency (direct or transitive) has a known vulnerability
    - name: Check vulnerable packages
      run: |
        dotnet list "$SOLUTION_NAME" package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
        if grep -q "has the following vulnerable packages" vulnerable.txt; then
          echo "::error title=Vulnerable packages::dotnet list package reported vulnerable dependencies (see the step log)"
          exit 1
        fi
